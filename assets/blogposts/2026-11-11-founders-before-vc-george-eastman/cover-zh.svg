<text x="530" y="120" font-family="PingFang SC" font-size="24" fill="#b0aea5" letter-spacing="1">风投诞生之前的创业者</text>
<text x="530" y="235" font-family="PingFang SC" font-weight="700" font-size="54" fill="#141413">伊士曼卖的</text>
<text x="530" y="305" font-family="PingFang SC" font-weight="700" font-size="54" fill="#141413">不只是相机，</text>
<text x="530" y="375" font-family="PingFang SC" font-weight="700" font-size="54" fill="#d97757">还有暗房</text>
<text x="530" y="470" font-family="Georgia" font-style="italic" font-size="28" fill="#141413">“You press the button,</text>
<text x="530" y="510" font-family="Georgia" font-style="italic" font-size="28" fill="#141413">we do the rest.” — Kodak ad, 1889</text>
<text x="530" y="580" font-family="PingFang SC" font-size="22" fill="#b0aea5">zzn.im</text>
