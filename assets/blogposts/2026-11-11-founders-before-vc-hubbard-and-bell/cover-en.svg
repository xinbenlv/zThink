  <text x="70" y="235" font-family="Georgia" font-weight="bold" font-size="58" fill="#141413">Founders Before VC:</text>
  <text x="70" y="315" font-family="Georgia" font-weight="bold" font-size="58" fill="#141413">Rent, Don't Sell</text>
