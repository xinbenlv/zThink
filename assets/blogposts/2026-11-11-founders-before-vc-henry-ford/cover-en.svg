  <text x="72" y="132" font-family="Avenir Next" font-size="40" font-weight="700" fill="#141413">Henry Ford Failed Twice Before Ford Motor Company</text>
  <text x="72" y="184" font-family="Georgia" font-size="28" fill="#5a5850">Founders before venture capital · 1899–1914</text>
  <rect x="72" y="208" width="96" height="5" fill="#d97757"/>
  <!-- timeline axis -->
  <line x1="0" y1="430" x2="1200" y2="430" stroke="#141413" stroke-width="3"/>
  <!-- company 1 -->
  <rect x="80" y="330" width="250" height="70" rx="6" fill="#e8e6dc" stroke="#b0aea5" stroke-width="2"/>
  <text x="205" y="360" text-anchor="middle" font-family="Avenir Next" font-size="21" font-weight="600" fill="#141413">Detroit Automobile Co.</text>
  <text x="205" y="388" text-anchor="middle" font-family="Avenir Next" font-size="19" fill="#5a5850">1899 – 1901</text>
  <line x1="92" y1="395" x2="318" y2="337" stroke="#b0aea5" stroke-width="3"/>
  <!-- company 2 -->
  <rect x="360" y="330" width="250" height="70" rx="6" fill="#e8e6dc" stroke="#b0aea5" stroke-width="2"/>
  <text x="485" y="360" text-anchor="middle" font-family="Avenir Next" font-size="21" font-weight="600" fill="#141413">Henry Ford Co.</text>
  <text x="485" y="388" text-anchor="middle" font-family="Avenir Next" font-size="19" fill="#5a5850">1901 – 1902 → Cadillac</text>
  <line x1="372" y1="395" x2="598" y2="337" stroke="#b0aea5" stroke-width="3"/>
  <!-- company 3 -->
  <rect x="640" y="330" width="250" height="70" rx="6" fill="#d97757"/>
  <text x="765" y="360" text-anchor="middle" font-family="Avenir Next" font-size="21" font-weight="700" fill="#faf9f5">Ford Motor Co.</text>
  <text x="765" y="388" text-anchor="middle" font-family="Avenir Next" font-size="19" fill="#faf9f5">16 June 1903</text>
  <!-- milestones -->
  <g font-family="Avenir Next" font-size="19" fill="#141413">
    <circle cx="950" cy="430" r="9" fill="#6a9bcc"/><text x="950" y="470" text-anchor="middle">Model T</text><text x="950" y="494" text-anchor="middle" fill="#5a5850">1908</text>
    <circle cx="1040" cy="430" r="9" fill="#788c5d"/><text x="1040" y="400" text-anchor="middle">Moving line</text><text x="1040" y="376" text-anchor="middle" fill="#5a5850">1913</text>
    <circle cx="1130" cy="430" r="9" fill="#d97757"/><text x="1130" y="470" text-anchor="middle">$5 day</text><text x="1130" y="494" text-anchor="middle" fill="#5a5850">1914</text>
  </g>
  <g fill="#141413"><circle cx="205" cy="430" r="7"/><circle cx="485" cy="430" r="7"/><circle cx="765" cy="430" r="9" fill="#d97757"/></g>
  <!-- checkbook dip -->
  <g font-family="Avenir Next" font-size="17" fill="#5a5850">
    <polyline points="660,520 780,598 880,512" fill="none" stroke="#141413" stroke-width="3"/>
    <circle cx="660" cy="520" r="5" fill="#141413"/><text x="652" y="510" text-anchor="end">$14,500 · 26 June</text>
    <circle cx="780" cy="598" r="5" fill="#d97757"/><text x="800" y="604">$223.65 · 10 July</text>
    <circle cx="880" cy="512" r="5" fill="#788c5d"/><text x="896" y="518">first car sold · 15 July</text>
  </g>
</svg>
