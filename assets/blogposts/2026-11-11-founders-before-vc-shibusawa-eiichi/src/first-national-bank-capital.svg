<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#faf9f5"/>
<rect x="0" y="0" width="1200" height="10" fill="#d97757"/>
<text x="110" y="110" font-family="Georgia,'Times New Roman',serif" font-size="44" fill="#141413" font-weight="600">First National Bank capital, 1873</text>
<text x="110" y="160" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#5e5d59">Planned ¥3,000,000 · raised ¥2,440,800</text>
<!-- planned outline -->
<rect x="110.0" y="300" width="980.0" height="110" fill="none" stroke="#141413" stroke-width="2"/>
<text x="110.0" y="282" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#141413">Planned capital ¥3,000,000</text>
<!-- offer bracket -->
<line x1="763.3333333333334" y1="270" x2="1090.0" y2="270" stroke="#6a9bcc" stroke-width="2"/>
<line x1="763.3333333333334" y1="262" x2="763.3333333333334" y2="278" stroke="#6a9bcc" stroke-width="2"/>
<line x1="1090.0" y1="262" x2="1090.0" y2="278" stroke="#6a9bcc" stroke-width="2"/>
<text x="1090.0" y="252" text-anchor="end" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#3d6f9e">Offered to the public: ¥1,000,000</text>
<rect x="110.0" y="300" width="653.3333333333334" height="110" fill="#d97757"/>
<rect x="763.3333333333334" y="300" width="143.9946666666666" height="110" fill="#6a9bcc"/>
<rect x="907.328" y="300" width="182.67200000000003" height="110" fill="url(#hatch)"/>
<defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f0eee6"/><line x1="0" y1="0" x2="0" y2="12" stroke="#b0aea5" stroke-width="3"/></pattern></defs>
<text x="134.0" y="350" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#faf9f5" font-weight="600">Mitsui and Ono</text>
<text x="134.0" y="386" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#faf9f5">¥2,000,000</text>
<!-- labels below for small segments -->
<line x1="835.3306666666667" y1="410" x2="835.3306666666667" y2="450" stroke="#3d6f9e" stroke-width="2"/>
<text x="703.3333333333334" y="482" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#3d6f9e" font-weight="600">Public</text>
<text x="703.3333333333334" y="514" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#3d6f9e">¥440,800</text>
<line x1="998.664" y1="410" x2="998.664" y2="450" stroke="#5e5d59" stroke-width="2"/>
<text x="1090.0" y="482" text-anchor="end" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#5e5d59" font-weight="600">Unsold public shares</text>
<text x="1090.0" y="514" text-anchor="end" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#5e5d59">¥559,200</text>
<line x1="110" y1="590" x2="1090" y2="590" stroke="#e8e6dc" stroke-width="2"/>
<text x="110" y="625" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#141413">71 shareholders · 24,408 shares · charter of June 11, 1873</text>
<text x="110" y="655" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#87867f">Source: Shibusawa Eiichi denki shiryō, vol. 4, pp. 22–24, 33</text>
</svg>